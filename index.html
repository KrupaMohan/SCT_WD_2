<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylish Stopwatch</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN (optional, for icons) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd 0%, #f0f8ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lap-times {
      max-height: 150px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-lg border-primary">
          <div class="card-body text-center">
            <h1 class="display-5 fw-bold text-primary mb-4" id="displayTime">00:00:00:000</h1>
            <div class="d-flex justify-content-center gap-2 mb-3 flex-wrap">
              <button id="startBtn" class="btn btn-success">
                <i class="bi bi-play-fill"></i> Start
              </button>
              <button id="pauseBtn" class="btn btn-warning text-white">
                <i class="bi bi-pause-fill"></i> Pause
              </button>
              <button id="resetBtn" class="btn btn-danger">
                <i class="bi bi-arrow-counterclockwise"></i> Reset
              </button>
              <button id="lapBtn" class="btn btn-info text-white">
                <i class="bi bi-flag"></i> Lap
              </button>
            </div>
            <div class="lap-times list-group" id="lapTimes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Bootstrap JS (optional, for some components) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
